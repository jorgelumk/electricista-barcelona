<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="12" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="210" fill="#f59e0b" fill-opacity="0.06" />

  <path 
    d="M 288,48 L 144,272 L 248,272 L 208,464 L 368,224 L 264,224 Z" 
    fill="url(#boltGrad)" 
    filter="url(#glow)"
    stroke="#ffffff" 
    stroke-width="6" 
    stroke-linejoin="round" 
  />
</svg>
